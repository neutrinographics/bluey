name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces a pull request's run; every run on main finishes,
  # so each commit there keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Resolving leaves the tree as committed
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "Resolving changed or added these files; commit them:"
            echo "$status"
            exit 1
          fi
      - run: flutter analyze
      # The guards and every root of new code that exists; the old folders
      # keep their layout until their code moves.
      - name: The guards and the placed code are formatted
        run: |
          paths="bluey_guards"
          for root in bluey/lib/src/api bluey/lib/src/features bluey/lib/src/shared/domain bluey/lib/src/shared/application bluey/lib/src/shared/infrastructure; do
            if [ -d "$root" ]; then paths="$paths $root"; fi
          done
          dart format --output=none --set-exit-if-changed $paths

  suites:
    name: Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: bluey_platform_interface, run: flutter test }
          - { package: bluey_android, run: flutter test }
          - { package: bluey_ios, run: flutter test }
          - { package: bluey_guards, run: dart test }
          - { package: bluey/example, run: flutter test }
          - { package: bluey_ios/example, run: flutter test }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: ${{ matrix.run }}
        working-directory: ${{ matrix.package }}

  bluey:
    name: Tests and coverage (bluey)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bluey
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: flutter test --coverage
      - run: dart run bluey_guards:coverage_gate coverage/lcov.info 90 lib

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Every package's rules, each judged even when another fails
        run: |
          failed=""
          for package in bluey bluey_platform_interface bluey_android bluey_ios; do
            (cd "$package" && flutter test test/architecture) || failed="$failed $package"
          done
          if [ -n "$failed" ]; then
            echo "The architecture rules failed in:$failed"
            exit 1
          fi

  list-growth:
    name: Lists only shrink
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # A pull request is compared with where it left its base branch; a
      # push to main with the commit main stood at before it.
      # Each package runs its own test/architecture/list_growth.dart, where
      # its rules say how their entries weigh; a list file with no such
      # script beside it fails the job rather than going unjudged.
      - name: No list grew since the change left its base
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          status=0
          for lists in */test/architecture/known_violations.dart; do
            package="${lists%%/*}"
            if [ ! -f "$package/test/architecture/list_growth.dart" ]; then
              echo "$lists has no test/architecture/list_growth.dart beside it"
              status=1
              continue
            fi
            files=test/architecture/known_violations.dart
            if [ -f "$package/test/known_defects/roster.dart" ]; then
              files="$files test/known_defects/roster.dart"
            fi
            echo "== $package"
            (cd "$package" && dart run test/architecture/list_growth.dart "$BASE" $files) || status=1
          done
          exit $status

  public-api:
    name: Public API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: dart run bluey_guards:public_api lib/bluey.dart api/bluey.api
        working-directory: bluey

  kotlin:
    name: Kotlin tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup
      - name: Fetch the Flutter embedding the Kotlin sources compile against
        run: flutter precache --android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - run: gradle test
        working-directory: bluey_android/android

  known-defects:
    name: Known defects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # A package's run and its roster leave both steps in the commit that
      # fixes its last known defect, or its empty run reads as "the run produced no result";
      # the job goes with the last package.
      - name: Run them; they are expected to fail
        run: |
          (cd bluey && flutter test test/known_defects --run-skipped --tags known-defect --reporter json > "$RUNNER_TEMP/bluey.json" || true)
          (cd bluey_android && flutter test test/known_defects --run-skipped --tags known-defect --reporter json > "$RUNNER_TEMP/bluey_android.json" || true)
      - name: Each one ran, and each one still fails
        run: |
          dart run bluey_guards:known_defects \
            test/known_defects/roster.dart "$RUNNER_TEMP/bluey.json" \
            ../bluey_android/test/known_defects/roster.dart "$RUNNER_TEMP/bluey_android.json"
        working-directory: bluey
